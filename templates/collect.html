<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collect Telemetry</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>

  <body class="collect-page">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">IoT</div>
          <div class="brand-text">
            <div class="brand-title">Telemetry</div>
            <div class="brand-subtitle">Monitoring Platform</div>
          </div>
        </div>

        <nav class="nav">
          <a class="nav-item" href="{{ url_for('dashboard') }}">Dashboard</a>
          <a class="nav-item" href="{{ url_for('analytics') }}">Analytics</a>
          <a class="nav-item" href="{{ url_for('admin') }}">Admin</a>
        </nav>

        <div class="sidebar-footer">
          <div class="hint">
            This runs the local collector<br />
            and writes into MongoDB.
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1 class="page-title">Collect</h1>
            <p class="page-subtitle">Start a telemetry run and watch progress live</p>
          </div>

          <div class="topbar-actions">
            <a class="btn" href="{{ url_for('dashboard') }}">Back to dashboard</a>
          </div>
        </header>

        <section class="panel collect-panel">
          <div class="panel-head">
            <h2 class="panel-title">Collector inputs</h2>
            <div class="panel-actions">
              <button class="btn" type="button" id="startBtn">Start</button>
            </div>
          </div>

          <div class="panel-body">
            <form id="collectForm" class="form-grid">
              <label class="field">
                <span class="field-label">Dataset size</span>
                <input class="input" type="number" name="dataset_size" min="1" max="1000" value="{{ default_dataset_size }}" />
              </label>

              <label class="field">
                <span class="field-label">Time interval (seconds)</span>
                <input class="input" type="number" name="time_interval" min="0" step="0.25" value="{{ default_time_interval }}" />
              </label>
            </form>

            <div class="divider"></div>

            <div class="status-row">
              <div class="muted">Status: <span id="statusText">Idle</span></div>
              <div class="mono" id="progressText">0/0</div>
            </div>

            <div class="progress-bar" aria-label="progress">
              <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>

            <pre class="log-box" id="logBox" aria-label="collector logs"></pre>
          </div>
        </section>
      </main>
    </div>

    <script src="{{ url_for('static', filename='collect.js') }}"></script>
  </body>
</html>
